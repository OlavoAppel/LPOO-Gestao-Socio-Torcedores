<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: base('Lotes do jogo')}"/>
    <link rel="stylesheet" th:href="@{/css/conta.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="page">
    <a th:href="@{/admin}" class="back-link">&larr; Painel administrativo</a>

    <div class="admin-head">
        <div>
            <h1 th:text="${jogo.get().getCasa().getNome() + ' x ' + jogo.get().getFora().getNome()}">Jogo</h1>
            <p style="color: var(--ink-muted); margin-top: 6px;">Lotes de ingressos deste jogo</p>
        </div>
        <button type="button" class="btn btn-cta"
                onclick="document.getElementById('modal-lote').showModal()">Novo lote</button>
    </div>

    <div class="table-wrap" th:if="${not #lists.isEmpty(lotes)}">
        <table class="table">
            <thead>
            <tr><th>Setor</th><th class="num">Preço base</th><th class="num">Estoque</th></tr>
            </thead>
            <tbody>
            <tr th:each="l : ${lotes}">
                <td th:text="${l.setor.nome}">Setor</td>
                <td class="num" th:text="${'R$ ' + #numbers.formatDecimal(l.precoBase, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</td>
                <td class="num" th:text="${l.estoqueDisponivel}">0</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="empty" th:if="${#lists.isEmpty(lotes)}">
        <strong>Nenhum lote cadastrado</strong>
        Use "Novo lote" para liberar ingressos de um setor.
    </div>
</main>

<dialog id="modal-lote" class="modal">
    <form th:action="@{/admin/cadastro/{id}/lotes(id=${jogo.get().getId()})}" th:object="${cadastroLoteForm}" method="post" class="form" novalidate>
        <h2>Novo lote</h2>

        <div class="alerts" th:if="${#fields.hasGlobalErrors()}">
            <p class="alert alert-error" role="alert" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
        </div>

        <div class="field">
            <label for="setorId">Setor</label>
            <select id="setorId" th:field="*{setorId}">
                <option value="">Selecione</option>
                <option th:each="s : ${setores}" th:value="${s.id}"
                        th:text="${s.nome + ' (capacidade ' + s.capacidadeTotal + ')'}"></option>
            </select>
            <span class="field-error" th:if="${#fields.hasErrors('setorId')}" th:errors="*{setorId}"></span>
        </div>

        <div class="field-row">
            <div class="field">
                <label for="precoBase">Preço base (R$)</label>
                <input type="number" step="0.01" min="0" id="precoBase" th:field="*{precoBase}">
                <span class="field-error" th:if="${#fields.hasErrors('precoBase')}" th:errors="*{precoBase}"></span>
            </div>
            <div class="field">
                <label for="estoque">Estoque</label>
                <input type="number" min="1" id="estoque" th:field="*{estoque}">
                <span class="field-error" th:if="${#fields.hasErrors('estoque')}" th:errors="*{estoque}"></span>
            </div>
        </div>

        <div class="modal-actions">
            <button type="button" class="btn btn-ghost" onclick="this.closest('dialog').close()">Cancelar</button>
            <button type="submit" class="btn btn-brand">Salvar lote</button>
        </div>
    </form>
</dialog>

<!-- reabre o modal quando o POST voltou com erro -->
<script th:if="${abrirModal}">
    document.getElementById('modal-lote').showModal();
</script>
</body>
</html>
