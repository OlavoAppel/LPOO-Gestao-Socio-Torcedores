<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar jogo</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="auth-wrap">
    <div class="auth-card" style="max-width: 480px; text-align: left;">
        <h1>Cadastrar jogo</h1>

        <form th:action="@{/admin/cadastro/jogo}" th:object="${cadastroJogoForm}" method="post">

            <label>Time da casa</label>
            <select th:field="*{casaId}">
                <option value="">Selecione...</option>
                <option th:each="t : ${times}" th:value="${t.id}" th:text="${t.nome}"></option>
            </select>
            <span class="auth-error" th:if="${#fields.hasErrors('casaId')}" th:errors="*{casaId}"></span>

            <label>Time visitante</label>
            <select th:field="*{foraId}">
                <option value="">Selecione...</option>
                <option th:each="t : ${times}" th:value="${t.id}" th:text="${t.nome}"></option>
            </select>
            <span class="auth-error" th:if="${#fields.hasErrors('foraId')}" th:errors="*{foraId}"></span>
            <span class="auth-error" th:if="${#fields.hasErrors('timesDiferentes')}" th:errors="*{timesDiferentes}"></span>

            <label>Data e hora</label>
            <input type="datetime-local" th:field="*{dhJogo}">
            <span class="auth-error" th:if="${#fields.hasErrors('dhJogo')}" th:errors="*{dhJogo}"></span>

            <label>Campeonato</label>
            <input type="text" th:field="*{campeonato}" placeholder="Brasileirão 2026">
            <span class="auth-error" th:if="${#fields.hasErrors('campeonato')}" th:errors="*{campeonato}"></span>

            <label>Estádio</label>
            <input type="text" th:field="*{nomeEstadio}" placeholder="MorumBIS">
            <span class="auth-error" th:if="${#fields.hasErrors('nomeEstadio')}" th:errors="*{nomeEstadio}"></span>

            <button type="submit" class="btn-cta">Salvar e cadastrar lotes</button>
        </form>
    </div>
</div>

</body>
</html>
