<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: base('Cadastrar jogo')}"/>
    <link rel="stylesheet" th:href="@{/css/conta.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="page page-narrow">
    <a th:href="@{/admin}" class="back-link">&larr; Painel administrativo</a>

    <div class="panel">
        <h1 style="font-size: 2.2rem; margin-bottom: 22px;">Cadastrar jogo</h1>

        <form th:action="@{/admin/cadastro/jogo}" th:object="${cadastroJogoForm}" method="post" class="form" novalidate>

            <div class="field-row">
                <div class="field">
                    <label for="casaId">Time da casa</label>
                    <select id="casaId" th:field="*{casaId}">
                        <option value="">Selecione</option>
                        <option th:each="t : ${times}" th:value="${t.id}" th:text="${t.nome}"></option>
                    </select>
                    <span class="field-error" th:if="${#fields.hasErrors('casaId')}" th:errors="*{casaId}"></span>
                </div>
                <div class="field">
                    <label for="foraId">Time visitante</label>
                    <select id="foraId" th:field="*{foraId}">
                        <option value="">Selecione</option>
                        <option th:each="t : ${times}" th:value="${t.id}" th:text="${t.nome}"></option>
                    </select>
                    <span class="field-error" th:if="${#fields.hasErrors('foraId')}" th:errors="*{foraId}"></span>
                </div>
            </div>
            <span class="field-error" th:if="${#fields.hasErrors('timesDiferentes')}" th:errors="*{timesDiferentes}"></span>

            <div class="field">
                <label for="estadioId">Estádio</label>
                <select id="estadioId" th:field="*{estadioId}">
                    <option value="">Selecione</option>
                    <option th:each="e : ${estadios}" th:value="${e.id}" th:text="${e.nome}"></option>
                </select>
                <span class="field-error" th:if="${#fields.hasErrors('estadioId')}" th:errors="*{estadioId}"></span>
            </div>

            <div class="field-row">
                <div class="field">
                    <label for="dhJogo">Data e hora</label>
                    <input type="datetime-local" id="dhJogo" th:field="*{dhJogo}">
                    <span class="field-error" th:if="${#fields.hasErrors('dhJogo')}" th:errors="*{dhJogo}"></span>
                </div>
                <div class="field">
                    <label for="campeonato">Campeonato</label>
                    <input type="text" id="campeonato" th:field="*{campeonato}" placeholder="Brasileirão 2026">
                    <span class="field-error" th:if="${#fields.hasErrors('campeonato')}" th:errors="*{campeonato}"></span>
                </div>
            </div>

            <button type="submit" class="btn btn-brand btn-block">Salvar e cadastrar lotes</button>
        </form>
    </div>
</main>

</body>
</html>
