<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: base('Entrar')}"/>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="page page-narrow auth-page">
    <div class="panel auth-panel">
        <h1>Entrar</h1>
        <p class="lead">Acesse sua conta para comprar ingressos e gerenciar sua associação.</p>

        <div class="alerts">
            <div th:if="${param.error}" class="alert alert-error" role="alert">Usuário ou senha incorretos. Confira os dados e tente de novo.</div>
            <div th:if="${param.logout}" class="alert alert-success">Você saiu da sua conta.</div>
            <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
        </div>

        <form th:action="@{/login}" method="post" class="form">
            <div class="field">
                <label for="login-user">Usuário</label>
                <input type="text" id="login-user" name="username" autocomplete="username" required autofocus>
            </div>

            <div class="field">
                <label for="login-pass">Senha</label>
                <input type="password" id="login-pass" name="password" autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn btn-brand btn-block">Entrar</button>
        </form>

        <p class="auth-footer">Ainda não tem conta? <a th:href="@{/cadastro}">Criar conta</a></p>
    </div>
</main>

</body>
</html>
