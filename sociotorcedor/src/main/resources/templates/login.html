<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Gera o token CSRF (e a sessão) antes do cabeçalho grande ser enviado ao navegador;
         sem isto o formulário falha com "Cannot create a session after the response has been committed". -->
    <meta name="_csrf" th:content="${_csrf.token}">
    <th:block th:replace="~{fragments/head :: base('Entrar')}"/>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('')}"></div>

<main id="conteudo" class="conteudo flex justify-center py-10 md:py-16">
    <div class="painel flex w-full max-w-md flex-col gap-6 p-6 sm:p-8">
        <header th:replace="~{fragments/ui :: cabecalho('Entrar',
                'Acesse sua conta para comprar ingressos e cuidar da sua associação.')}"></header>

        <div class="flex flex-col gap-2" th:if="${param.error != null or param.logout != null or sucesso != null}">
            <p th:if="${param.error}" class="alerta alerta-erro" role="alert">
                Usuário ou senha incorretos. Confira os dois campos e tente de novo.</p>
            <p th:if="${param.logout}" class="alerta alerta-ok" role="status">Você saiu da sua conta.</p>
            <p th:if="${sucesso}" class="alerta alerta-ok" role="status" th:text="${sucesso}"></p>
        </div>

        <form th:action="@{/login}" method="post" class="flex flex-col gap-5">
            <div class="campo">
                <label for="login-user" class="rotulo">Usuário</label>
                <input type="text" id="login-user" name="username" class="entrada"
                       autocomplete="username" autocapitalize="none" required autofocus>
            </div>

            <div class="campo">
                <label for="login-pass" class="rotulo">Senha</label>
                <input type="password" id="login-pass" name="password" class="entrada"
                       autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn btn-principal w-full">Entrar</button>
        </form>

        <p class="border-t border-line pt-5 text-ink-muted">
            Ainda não tem conta? <a th:href="@{/cadastro}" class="link">Criar conta</a></p>
    </div>
</main>

<footer th:replace="~{fragments/footer :: rodape}"></footer>

</body>
</html>
