<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: base('Ingresso comprado')}"/>
</head>
<body>
<header th:replace="~{fragments/navegacao :: topo('jogos')}"></header>

<main id="conteudo" class="moldura grid gap-8 py-10 md:py-16">
    <header class="grid max-w-2xl gap-3">
        <p class="flex items-center gap-2 font-bold text-success">
            <svg th:replace="~{fragments/icones :: icone('check', 'size-6')}"></svg>
            <span>Compra concluída</span>
        </p>
        <h1 class="display text-4xl sm:text-5xl">Ingresso comprado</h1>
        <p class="text-lg text-ink-muted">Ele já está em Minha conta. Na entrada do estádio, apresente o código abaixo.</p>
    </header>

    <!-- Comprovante: o ingresso comprado por último (só leitura) -->
    <section th:if="${ingresso != null}" aria-label="Comprovante" class="comprovante grid max-w-2xl gap-6 rounded-controle border border-line bg-surface p-5 sm:p-8"
             th:with="jogo=${ingresso.lote.jogo}">
        <span th:replace="~{fragments/jogo :: confronto(${jogo}, 'size-10', 'display text-3xl leading-none')}"></span>
        <dl class="grid gap-x-8 gap-y-4 sm:grid-cols-2">
            <div>
                <dt class="text-sm text-ink-muted">Quando</dt>
                <dd class="font-bold" th:text="${@formato.diaSemanaLongo(jogo.dhJogo) + ', ' + @formato.diaMes(jogo.dhJogo) + ', às ' + @formato.hora(jogo.dhJogo)}">Segunda-feira, 23 nov, às 21h</dd>
            </div>
            <div>
                <dt class="text-sm text-ink-muted">Onde</dt>
                <dd class="font-bold" th:text="${jogo.estadio.nome + ', ' + (ingresso.lote.setor != null ? ingresso.lote.setor.nome : ingresso.lote.nome)}">MorumBIS, Cadeira Inferior</dd>
            </div>
            <div>
                <dt class="text-sm text-ink-muted">Valor pago</dt>
                <dd class="numero font-bold" th:text="${@formato.real(ingresso.precoPago)}">R$ 67,50</dd>
            </div>
            <div>
                <dt class="text-sm text-ink-muted">Código de entrada</dt>
                <dd class="display numero text-4xl leading-none tracking-wider" th:text="${@formato.codigoCurto(ingresso.codigo)}">ABCD1234</dd>
            </div>
        </dl>
    </section>

    <div class="flex flex-wrap items-center gap-x-6 gap-y-3">
        <a th:href="@{/perfil}" class="botao botao-primario">Ver meus ingressos</a>
        <a th:href="@{/jogos}" class="link font-semibold">Ver outros jogos</a>
    </div>
</main>

<footer th:replace="~{fragments/rodape :: rodape}"></footer>
<nav th:replace="~{fragments/navegacao :: abas('jogos')}"></nav>
</body>
</html>
