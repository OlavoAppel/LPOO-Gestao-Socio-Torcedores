<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: base('Painel administrativo')}"/>
    <link rel="stylesheet" th:href="@{/css/conta.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="page">
    <div class="page-head">
        <h1>Painel administrativo</h1>
        <p>Olá, <span th:text="${#authentication.principal.username}">admin</span>. O que você quer fazer?</p>
    </div>

    <div class="admin-links">
        <section class="panel admin-link">
            <h2>Cadastrar jogo</h2>
            <p>Registre uma partida e depois defina os lotes de ingressos de cada setor.</p>
            <a th:href="@{/admin/cadastro/jogo}" class="btn btn-brand">Novo jogo</a>
        </section>
        <section class="panel admin-link">
            <h2>Métricas</h2>
            <p>Total de sócios, novos associados e arrecadação por categoria.</p>
            <a th:href="@{/admin/metricas}" class="btn btn-ghost">Ver métricas</a>
        </section>
    </div>
</main>

</body>
</html>
