<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: base('Administração')}"/>
</head>
<body>
<header th:replace="~{fragments/navegacao :: topo('admin')}"></header>

<main id="conteudo" class="moldura grid gap-12 py-10 md:py-14"
      th:with="proximos=${jogos.?[!encerrado]}, encerrados=${jogos.?[encerrado]}">
    <header class="flex flex-wrap items-end justify-between gap-6">
        <div class="grid gap-2">
            <h1 class="display text-3xl sm:text-4xl">Administração</h1>
            <p class="text-ink-muted">Jogos, lotes de ingressos e os números do mês.</p>
        </div>
        <div class="flex flex-wrap gap-3">
            <a th:href="@{/admin/cadastro/jogo}" class="botao botao-primario">
                <svg th:replace="~{fragments/icones :: icone('mais', 'size-5')}"></svg>
                Cadastrar jogo
            </a>
            <a th:href="@{/admin/metricas}" class="botao botao-secundario">
                <svg th:replace="~{fragments/icones :: icone('grafico', 'size-5')}"></svg>
                Ver métricas
            </a>
        </div>
    </header>

    <!-- Números do mês: uma faixa só, a receita em destaque -->
    <section aria-labelledby="titulo-numeros">
        <h2 id="titulo-numeros" class="sr-only">Números do mês</h2>
        <dl class="grid gap-px overflow-hidden rounded-controle border border-line bg-line sm:grid-cols-2 lg:grid-cols-[1.4fr_repeat(4,minmax(0,1fr))]">
            <div class="grid gap-1 bg-surface p-5">
                <dt class="text-sm text-ink-muted">Receita de ingressos no mês</dt>
                <dd class="display numero text-4xl leading-none"><span th:replace="~{fragments/ui :: dinheiro(${dashboardInfo.receitaIngressos})}"></span></dd>
            </div>
            <div class="grid gap-1 bg-surface p-5">
                <dt class="text-sm text-ink-muted">Ingressos vendidos no mês</dt>
                <dd class="display numero text-3xl leading-none" th:text="${@formato.inteiro(dashboardInfo.ingressosVendidos)}">87</dd>
            </div>
            <div class="grid gap-1 bg-surface p-5">
                <dt class="text-sm text-ink-muted">Sócios</dt>
                <dd class="display numero text-3xl leading-none" th:text="${@formato.inteiro(dashboardInfo.associadosTotal)}">35</dd>
            </div>
            <div class="grid gap-1 bg-surface p-5">
                <dt class="text-sm text-ink-muted">Novos sócios no mês</dt>
                <dd class="display numero text-3xl leading-none" th:text="${@formato.inteiro(dashboardInfo.novosAssociadosMesAtual)}">12</dd>
            </div>
            <div class="grid gap-1 bg-surface p-5">
                <dt class="text-sm text-ink-muted">Arrecadação total</dt>
                <dd class="display numero text-3xl leading-none"><span th:replace="~{fragments/ui :: dinheiro(${dashboardInfo.ganhosTotais})}"></span></dd>
            </div>
        </dl>
    </section>

    <section aria-labelledby="titulo-proximos" class="grid gap-4">
        <div class="flex flex-wrap items-baseline justify-between gap-3">
            <h2 id="titulo-proximos" class="display text-2xl">Próximos jogos</h2>
            <p class="text-sm text-ink-muted">Sem lote, o setor não vende ingressos.</p>
        </div>
        <div th:replace="~{fragments/admin :: tabelaJogos(${proximos}, 'Próximos jogos: lotes cadastrados e vendas')}"></div>
        <th:block th:if="${#lists.isEmpty(proximos)}">
            <div th:replace="~{fragments/ui :: vazio('Nenhum jogo marcado', 'Cadastre a próxima partida para abrir a venda de ingressos.', @{/admin/cadastro/jogo}, 'Cadastrar jogo')}"></div>
        </th:block>
    </section>

    <details th:unless="${#lists.isEmpty(encerrados)}" class="group min-w-0">
        <summary class="flex min-h-11 cursor-pointer list-none items-center gap-2 font-bold [&::-webkit-details-marker]:hidden">
            <svg th:replace="~{fragments/icones :: icone('seguir', 'size-5 transition-transform group-open:rotate-90')}"></svg>
            <span th:text="${'Jogos já disputados (' + #lists.size(encerrados) + ')'}">Jogos já disputados (10)</span>
        </summary>
        <div class="mt-4">
            <div th:replace="~{fragments/admin :: tabelaJogos(${encerrados}, 'Jogos já disputados: lotes e vendas')}"></div>
        </div>
    </details>
</main>

<footer th:replace="~{fragments/rodape :: rodape}"></footer>
<nav th:replace="~{fragments/navegacao :: abas('admin')}"></nav>
</body>
</html>
