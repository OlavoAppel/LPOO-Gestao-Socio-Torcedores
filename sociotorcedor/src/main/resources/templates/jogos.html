<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: base('Jogos')}"/>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('jogos')}"></div>

<main id="conteudo" class="conteudo flex flex-col gap-6 py-10"
      th:with="proximoId=${jogosData.proximoJogo != null ? jogosData.proximoJogo.id : null}">

    <header th:replace="~{fragments/ui :: cabecalho('Calendário de jogos',
            'Escolha o mês para ver as partidas da temporada. Abrimos no mês do próximo jogo.')}"></header>

    <div th:replace="~{fragments/ui :: alertas(null, ${erro})}"></div>

    <!-- Meses: o script abaixo filtra a lista por data-mes -->
    <nav class="meses-nav -mx-4 flex gap-2 overflow-x-auto px-4 pb-1 sm:mx-0 sm:px-0 md:flex-wrap md:overflow-visible"
         aria-label="Filtrar jogos por mês"
         th:data-mes-inicial="${jogosData.proximoJogo != null} ? ${jogosData.proximoJogo.dhJogo.monthValue}">
        <button type="button" class="mes-item group" data-mes="1" aria-pressed="false">Janeiro</button>
        <button type="button" class="mes-item group" data-mes="2" aria-pressed="false">Fevereiro</button>
        <button type="button" class="mes-item group" data-mes="3" aria-pressed="false">Março</button>
        <button type="button" class="mes-item group" data-mes="4" aria-pressed="false">Abril</button>
        <button type="button" class="mes-item group" data-mes="5" aria-pressed="false">Maio</button>
        <button type="button" class="mes-item group" data-mes="6" aria-pressed="false">Junho</button>
        <button type="button" class="mes-item group" data-mes="7" aria-pressed="false">Julho</button>
        <button type="button" class="mes-item group" data-mes="8" aria-pressed="false">Agosto</button>
        <button type="button" class="mes-item group" data-mes="9" aria-pressed="false">Setembro</button>
        <button type="button" class="mes-item group" data-mes="10" aria-pressed="false">Outubro</button>
        <button type="button" class="mes-item group" data-mes="11" aria-pressed="false">Novembro</button>
        <button type="button" class="mes-item group" data-mes="12" aria-pressed="false">Dezembro</button>
    </nav>

    <!-- Lista: sem JavaScript, todos os jogos do ano aparecem -->
    <div class="jogos-list flex flex-col gap-3">
        <th:block th:each="jogo : ${jogosData.jogosList}">
            <article th:replace="~{fragments/jogo :: linha(${jogo}, ${jogo.id == proximoId})}"></article>
        </th:block>

        <div id="no-games-msg" hidden>
            <div th:replace="~{fragments/ui :: vazio('Nenhum jogo neste mês',
                    'Os meses marcados com um ponto têm partidas. Escolha um deles para ver os jogos.', null, null)}"></div>
        </div>
    </div>

</main>

<footer th:replace="~{fragments/footer :: rodape}"></footer>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        var botoes = document.querySelectorAll('.meses-nav .mes-item');
        var cards = document.querySelectorAll('.jogo-card');
        var vazio = document.getElementById('no-games-msg');
        var nav = document.querySelector('.meses-nav');

        // marca meses que têm jogos (ponto visível + texto para leitor de tela)
        cards.forEach(function (c) {
            var b = document.querySelector('.mes-item[data-mes="' + c.dataset.mes + '"]');
            if (b && !b.classList.contains('has-games')) {
                b.classList.add('has-games');
                b.insertAdjacentHTML('beforeend', '<span class="sr-only">, tem jogos</span>');
            }
        });

        function mostrar(mes) {
            var achou = 0;
            botoes.forEach(function (b) {
                var ativo = b.dataset.mes === mes;
                b.classList.toggle('active', ativo);
                b.setAttribute('aria-pressed', ativo ? 'true' : 'false');
            });
            cards.forEach(function (c) {
                var visivel = c.dataset.mes === mes;
                c.hidden = !visivel;
                if (visivel) achou++;
            });
            vazio.hidden = achou > 0;
        }

        botoes.forEach(function (b) {
            b.addEventListener('click', function () { mostrar(b.dataset.mes); });
        });

        // mês inicial: o do próximo jogo; se não houver, o mês atual
        mostrar(nav.dataset.mesInicial || String(new Date().getMonth() + 1));
        var ativo = document.querySelector('.mes-item.active');
        if (ativo && ativo.scrollIntoView) ativo.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
</script>

</body>
</html>
