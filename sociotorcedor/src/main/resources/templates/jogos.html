<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: base('Jogos')}"/>
</head>
<body>
<header th:replace="~{fragments/navegacao :: topo('jogos')}"></header>

<main id="conteudo" class="moldura grid gap-10 py-10 md:py-14"
      th:with="proximoId=${jogosData.proximoJogo != null ? jogosData.proximoJogo.id : null},
               totalEncerrados=${#aggregates.sum(encerradosPorMes.![jogos.size()]) ?: 0}">
    <header th:replace="~{fragments/ui :: cabecalho('Calendário de jogos',
            'Escolha um jogo para ver os setores, os preços de cada categoria de sócio e comprar o ingresso.')}"></header>

    <!-- A compra recusada volta para cá com o motivo dado pelo backend (flash "erro") -->
    <p th:if="${erro}" role="alert" class="aviso aviso-erro max-w-3xl">
        <svg th:replace="~{fragments/icones :: icone('alerta', 'size-6 shrink-0 text-danger')}"></svg>
        <span>
            <strong class="block">A compra não foi concluída.</strong>
            <span th:text="${erro}">Motivo</span>
        </span>
    </p>

    <!-- Atalhos para os meses com jogos (links internos: funcionam sem JavaScript) -->
    <nav th:if="${#lists.size(proximosPorMes) > 1}" aria-label="Meses com jogos" class="-mx-1 flex flex-wrap gap-2">
        <a th:each="m : ${proximosPorMes}" th:href="${'#' + m.ancora}"
           class="botao botao-secundario min-h-10 px-4 py-1.5 text-sm"
           th:text="${@formato.nomeMes(m.mes)}">Novembro</a>
    </nav>

    <section aria-labelledby="titulo-proximos" class="grid gap-8">
        <h2 id="titulo-proximos" class="sr-only">Próximos jogos</h2>
        <section th:each="m : ${proximosPorMes}" th:id="${m.ancora}" class="grid gap-2"
                 th:attr="aria-labelledby=${'titulo-' + m.ancora}">
            <h3 th:id="${'titulo-' + m.ancora}" class="display text-xl text-ink-muted"
                th:text="${@formato.nomeMes(m.mes) + ' de ' + m.ano}">Novembro de 2026</h3>
            <ul class="border-t border-line">
                <li th:each="jogo : ${m.jogos}">
                    <a th:replace="~{fragments/jogo :: linha(${jogo}, ${jogo.id == proximoId})}"></a>
                </li>
            </ul>
        </section>
        <th:block th:if="${#lists.isEmpty(proximosPorMes)}">
            <div th:replace="~{fragments/ui :: vazio('Nenhum jogo marcado por enquanto',
                    'Os próximos jogos da temporada aparecem aqui assim que forem cadastrados.', null, null)}"></div>
        </th:block>
    </section>

    <details th:if="${not #lists.isEmpty(encerradosPorMes)}" class="group border-t border-line pt-6">
        <summary class="flex min-h-11 cursor-pointer list-none items-center gap-2 font-bold [&::-webkit-details-marker]:hidden">
            <svg th:replace="~{fragments/icones :: icone('seguir', 'size-5 transition-transform group-open:rotate-90')}"></svg>
            <span th:text="${'Jogos já disputados (' + totalEncerrados + ')'}">Jogos já disputados (10)</span>
        </summary>
        <div class="mt-4 grid gap-8">
            <section th:each="m : ${encerradosPorMes}" class="grid gap-2">
                <h3 class="display text-xl text-ink-muted" th:text="${@formato.nomeMes(m.mes) + ' de ' + m.ano}">Outubro de 2026</h3>
                <ul class="border-t border-line">
                    <li th:each="jogo : ${m.jogos}">
                        <a th:replace="~{fragments/jogo :: linha(${jogo}, false)}"></a>
                    </li>
                </ul>
            </section>
        </div>
    </details>
</main>

<footer th:replace="~{fragments/rodape :: rodape}"></footer>
<nav th:replace="~{fragments/navegacao :: abas('jogos')}"></nav>
</body>
</html>
