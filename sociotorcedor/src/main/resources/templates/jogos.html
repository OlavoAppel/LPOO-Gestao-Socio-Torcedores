<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: base('Jogos')}"/>
    <link rel="stylesheet" th:href="@{/css/jogos.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="page">

    <div class="page-head">
        <h1>Calendário de jogos</h1>
        <p>Escolha o mês e veja as partidas da temporada.</p>
    </div>

    <div class="alerts" th:if="${erro}">
        <div class="alert alert-error" role="alert" th:text="${erro}"></div>
    </div>

    <!-- Próximo jogo -->
    <article class="ticket ticket-hero" th:if="${jogosData.proximoJogo != null}">
        <div class="ticket-main">
            <div class="match-main">
                <div class="match-info">
                    <span class="match-campeonato" th:text="${jogosData.proximoJogo.campeonato}">Campeonato</span>
                    <span class="match-quando"
                          th:text="${#temporals.format(jogosData.proximoJogo.dhJogo, 'dd/MM/yyyy (EEEE) · HH:mm')}">19/09/2026 · 21:00</span>
                    <span class="match-estadio" th:text="${jogosData.proximoJogo.nomeEstadio}">Estádio</span>
                </div>
                <div class="versus">
                    <img th:src="@{${jogosData.proximoJogo.casa.escudoPath}}" th:alt="${jogosData.proximoJogo.casa.sigla}" class="escudo-img">
                    <span class="x">x</span>
                    <img th:src="@{${jogosData.proximoJogo.fora.escudoPath}}" th:alt="${jogosData.proximoJogo.fora.sigla}" class="escudo-img">
                </div>
            </div>
        </div>
        <div class="ticket-stub">
            <span class="stub-label">Próximo jogo</span>
            <a th:href="@{/ingressos(jogoId=${jogosData.proximoJogo.id})}" class="btn btn-cta">Comprar ingressos</a>
        </div>
    </article>

    <!-- Meses -->
    <nav class="meses-nav" aria-label="Filtrar por mês"
         th:data-mes-inicial="${jogosData.proximoJogo != null} ? ${jogosData.proximoJogo.dhJogo.monthValue}">
        <button type="button" class="mes-item" data-mes="1">Janeiro</button>
        <button type="button" class="mes-item" data-mes="2">Fevereiro</button>
        <button type="button" class="mes-item" data-mes="3">Março</button>
        <button type="button" class="mes-item" data-mes="4">Abril</button>
        <button type="button" class="mes-item" data-mes="5">Maio</button>
        <button type="button" class="mes-item" data-mes="6">Junho</button>
        <button type="button" class="mes-item" data-mes="7">Julho</button>
        <button type="button" class="mes-item" data-mes="8">Agosto</button>
        <button type="button" class="mes-item" data-mes="9">Setembro</button>
        <button type="button" class="mes-item" data-mes="10">Outubro</button>
        <button type="button" class="mes-item" data-mes="11">Novembro</button>
        <button type="button" class="mes-item" data-mes="12">Dezembro</button>
    </nav>

    <!-- Lista -->
    <div class="jogos-list">
        <article class="ticket jogo-card"
                 th:each="jogo : ${jogosData.jogosList}"
                 th:data-mes="${jogo.dhJogo.monthValue}">
            <div class="ticket-main">
                <div class="match-main">
                    <div class="match-info">
                        <span class="match-campeonato" th:text="${jogo.campeonato}">Campeonato</span>
                        <span class="match-quando"
                              th:text="${#temporals.format(jogo.dhJogo, 'dd/MM/yyyy (EEEE) · HH:mm')}">05/09/2026 · 18:30</span>
                        <span class="match-estadio" th:text="${jogo.nomeEstadio}">Estádio</span>
                    </div>
                    <div class="versus">
                        <img th:src="@{${jogo.casa.escudoPath}}" th:alt="${jogo.casa.sigla}" class="escudo-img">
                        <span class="x">x</span>
                        <img th:src="@{${jogo.fora.escudoPath}}" th:alt="${jogo.fora.sigla}" class="escudo-img">
                    </div>
                </div>
            </div>
            <div class="ticket-stub">
                <a th:href="@{/ingressos(jogoId=${jogo.id})}" class="btn btn-ghost">Ver ingressos</a>
            </div>
        </article>

        <div id="no-games-msg" class="empty" hidden>
            <strong>Nenhum jogo neste mês</strong>
            Escolha outro mês para ver as partidas.
        </div>
    </div>

</main>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        var botoes = document.querySelectorAll('.meses-nav .mes-item');
        var cards = document.querySelectorAll('.jogo-card');
        var vazio = document.getElementById('no-games-msg');
        var nav = document.querySelector('.meses-nav');

        // marca meses que têm jogos
        cards.forEach(function (c) {
            var b = document.querySelector('.mes-item[data-mes="' + c.dataset.mes + '"]');
            if (b) b.classList.add('has-games');
        });

        function mostrar(mes) {
            var achou = 0;
            botoes.forEach(function (b) { b.classList.toggle('active', b.dataset.mes === mes); });
            cards.forEach(function (c) {
                var visivel = c.dataset.mes === mes;
                c.hidden = !visivel;
                if (visivel) achou++;
            });
            vazio.hidden = achou > 0;
        }

        botoes.forEach(function (b) {
            b.addEventListener('click', function () { mostrar(b.dataset.mes); });
        });

        // mês inicial: o do próximo jogo; se não houver, o mês atual
        mostrar(nav.dataset.mesInicial || String(new Date().getMonth() + 1));
        var ativo = document.querySelector('.mes-item.active');
        if (ativo && ativo.scrollIntoView) ativo.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
</script>

</body>
</html>
