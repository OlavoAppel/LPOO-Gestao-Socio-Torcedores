<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: base('Ingressos')}"/>
    <link rel="stylesheet" th:href="@{/css/ingressos.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="page page-ingressos">

    <a th:href="@{/jogos}" class="back-link">&larr; Voltar aos jogos</a>

    <div class="page-head">
        <h1>Escolha seu setor</h1>
        <p>O preço já considera o desconto da sua categoria de sócio, quando houver.</p>
    </div>

    <div class="lotes-list">
        <article th:each="lote : ${lotes}"
                 th:class="${lote.valido()} ? 'ticket lote-card' : 'ticket lote-card lote-disabled'">

            <div class="ticket-main">
                <span class="lote-nome" th:text="${lote.nome()}">Cadeira Norte</span>
                <span th:if="${!lote.valido()}" class="lote-motivo" th:text="${lote.motivo()}">Indisponível para sua categoria</span>
            </div>

            <div class="ticket-stub">
                <div class="lote-preco">
                    <span th:if="${lote.precoComDesconto() != null and lote.precoComDesconto().compareTo(lote.precoBase()) < 0}"
                          class="preco-base-riscado"
                          th:text="${'R$ ' + #numbers.formatDecimal(lote.precoBase(), 1, 'POINT', 2, 'COMMA')}">R$ 150,00</span>
                    <span class="preco-final"
                          th:text="${'R$ ' + #numbers.formatDecimal(lote.precoComDesconto() ?: lote.precoBase(), 1, 'POINT', 2, 'COMMA')}">R$ 120,00</span>
                </div>
                <form th:action="@{/ingressos/comprar}" method="post">
                    <input type="hidden" name="loteId" th:value="${lote.id()}">
                    <button type="submit" class="btn btn-cta btn-block" th:disabled="${!lote.valido()}"
                            th:text="${lote.valido()} ? 'Comprar' : 'Indisponível'">Comprar</button>
                </form>
            </div>
        </article>

        <div th:if="${#lists.isEmpty(lotes)}" class="empty">
            <strong>Sem ingressos à venda</strong>
            Este jogo ainda não tem lotes disponíveis.
        </div>
    </div>

</main>

</body>
</html>
