<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: base('Início')}"/>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('inicio')}"></div>

<main id="conteudo"
      th:with="proximo=${jogosData.proximoJogo},
               seguintes=${jogosData.jogosList == null ? null : jogosData.jogosList.?[dhJogo.isAfter(#temporals.createNow()) and (#root.proximo == null or id != #root.proximo.id)]}">

    <th:block th:if="${proximo != null}">
        <section th:replace="~{fragments/jogo :: placar(${proximo})}"></section>
    </th:block>

    <div class="conteudo flex flex-col gap-6 pt-10" th:if="${proximo == null}">
        <h1 class="titulo-pagina">Próximo jogo</h1>
        <div th:replace="~{fragments/ui :: vazio('Nenhum jogo marcado por enquanto',
                'Assim que a próxima partida for cadastrada, ela aparece aqui com o horário e o estádio.',
                @{/jogos}, 'Ver o calendário')}"></div>
    </div>

    <div class="conteudo grid gap-10 py-10 md:py-14 lg:grid-cols-[1fr_22rem] lg:gap-12">

        <section aria-labelledby="titulo-seguintes" class="flex flex-col gap-4">
            <div class="flex flex-wrap items-baseline justify-between gap-2">
                <h2 id="titulo-seguintes" class="titulo-secao">Jogos seguintes</h2>
                <a th:href="@{/jogos}" class="link">Calendário completo</a>
            </div>
            <th:block th:if="${seguintes != null and not #lists.isEmpty(seguintes)}">
                <th:block th:each="jogo, st : ${seguintes}" th:if="${st.index < 3}">
                    <article th:replace="~{fragments/jogo :: linha(${jogo}, false)}"></article>
                </th:block>
            </th:block>
            <p th:if="${seguintes == null or #lists.isEmpty(seguintes)}" class="text-ink-muted">
                Ainda não há outros jogos marcados para este ano.</p>
        </section>

        <aside aria-labelledby="titulo-socio" class="painel flex flex-col gap-4 self-start p-6">
            <h2 id="titulo-socio" class="titulo-secao">Seja sócio do <span th:text="#{clube.curto}">Lagoa EC</span></h2>
            <ul class="flex flex-col gap-3">
                <li class="flex gap-3">
                    <svg width="20" height="20" class="mt-0.5 size-5 shrink-0 text-success" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
                    <span>Desconto em todos os ingressos, maior a cada categoria.</span>
                </li>
                <li class="flex gap-3">
                    <svg width="20" height="20" class="mt-0.5 size-5 shrink-0 text-success" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
                    <span>Acesso a setores exclusivos, como o camarote.</span>
                </li>
                <li class="flex gap-3">
                    <svg width="20" height="20" class="mt-0.5 size-5 shrink-0 text-success" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
                    <span>Brindes e experiências no clube.</span>
                </li>
            </ul>
            <a th:href="@{/sociotorcedor}" class="btn btn-principal">Conhecer os planos</a>
        </aside>
    </div>
</main>

<footer th:replace="~{fragments/footer :: rodape}"></footer>

</body>
</html>
