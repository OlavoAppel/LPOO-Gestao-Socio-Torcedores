<!--
  Ícones de traço (24 x 24, cor do texto). Decorativos: o texto ao lado dá o nome.
  Uso: <svg th:replace="~{fragments/icones :: icone('jogos', 'size-5')}"></svg>
-->
<html xmlns:th="http://www.thymeleaf.org">

     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    <th:block th:switch="${nome}">
        <th:block th:case="'inicio'"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9v11.5h13V9"/><path d="M10 20.5v-5.5h4v5.5"/></th:block>
        <th:block th:case="'jogos'"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></th:block>
        <th:block th:case="'socio'"><rect x="3" y="5.5" width="18" height="13" rx="2"/><circle cx="8.5" cy="11" r="2"/><path d="M5.6 16c.6-1.4 1.6-2.1 2.9-2.1s2.3.7 2.9 2.1M14 10h4M14 13.5h3"/></th:block>
        <th:block th:case="'conta'"><circle cx="12" cy="8" r="3.8"/><path d="M4.5 20.5c1.4-3.6 4.2-5.4 7.5-5.4s6.1 1.8 7.5 5.4"/></th:block>

        <th:block th:case="'noticias'"><path d="M4 5h12.5v14H6a2 2 0 0 1-2-2z"/><path d="M16.5 9H20v8a2 2 0 0 1-2 2h-1.5"/><path d="M7 9h6.5M7 12.5h6.5M7 16h4"/></th:block>
        <th:block th:case="'lua'"><path d="M19.5 14.6A7.8 7.8 0 1 1 9.4 4.5a6.3 6.3 0 0 0 10.1 10.1z"/></th:block>
        <th:block th:case="'sol'"><circle cx="12" cy="12" r="3.8"/><path d="M12 2.5v2.2M12 19.3v2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M2.5 12h2.2M19.3 12h2.2M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></th:block>

        <th:block th:case="'seguir'"><path d="m9.5 6 6 6-6 6"/></th:block>
        <th:block th:case="'check'"><path d="m5 12.5 4.5 4.5L19 7.5"/></th:block>
        <th:block th:case="'alerta'"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5.2M12 16.2v.3"/></th:block>
        <th:block th:case="'cadeado'"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></th:block>
        <th:block th:case="'cadeira'"><path d="M7 3.5h10a1 1 0 0 1 1 1V12H6V4.5a1 1 0 0 1 1-1z"/><path d="M4.5 12h15v3.5h-15zM7 15.5v5M17 15.5v5"/></th:block>

        <th:block th:case="'mais'"><path d="M12 5v14M5 12h14"/></th:block>

        <th:block th:case="'grafico'"><path d="M4.5 20V11M10 20V5M15.5 20v-6.5M21 20.5H3"/></th:block>
        <th:block th:case="'ponto'"><circle cx="12" cy="12" r="3" fill="currentColor"/></th:block>

</html>
