<header th:fragment="navbar" class="navbar-wrap"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <div class="navbar">

        <a th:href="@{/}" class="brand" aria-label="Página inicial">
            <span class="crest">FC</span>
            <span class="brand-name">Sócio-Torcedor</span>
        </a>

        <nav class="nav-links" aria-label="Principal">
            <a th:href="@{/}" class="nav-link">Início</a>
            <a th:href="@{/jogos}" class="nav-link">Jogos</a>
            <a th:href="@{/sociotorcedor}" class="nav-link">Seja sócio</a>
            <a th:href="@{/admin}" class="nav-link" sec:authorize="hasRole('ADMIN')">Painel admin</a>
        </nav>

        <div class="nav-actions">
            <button type="button" class="icon-btn" id="themeToggle" aria-label="Usar tema escuro" aria-pressed="false">
                <svg class="icon-svg icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
                <svg class="icon-svg icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
            </button>

            <div sec:authorize="isAnonymous()">
                <a th:href="@{/login}" class="btn btn-cta">Entrar</a>
            </div>

            <div sec:authorize="isAuthenticated()" class="profile-dropdown-container">
                <button type="button" class="icon-btn" id="userMenuBtn"
                        aria-label="Menu da conta" aria-haspopup="true" aria-expanded="false">
                    <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </button>

                <div class="profile-dropdown" id="profileDropdown">
                    <p class="dropdown-greeting">Olá, <strong sec:authentication="name">usuário</strong></p>
                    <ul class="dropdown-links">
                        <li><a th:href="@{/perfil}">Minha conta</a></li>
                        <li><a th:href="@{/sociotorcedor}">Minha associação</a></li>
                        <li sec:authorize="hasRole('ADMIN')"><a th:href="@{/admin}">Painel administrativo</a></li>
                        <li class="logout-item">
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="logout-btn">Sair</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <script th:src="@{/js/theme.js}"></script>
</header>
