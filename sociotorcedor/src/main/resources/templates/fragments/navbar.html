<!-- Navbar. Uso: <div th:replace="~{fragments/navbar :: navbar('jogos')}"></div>
     O parâmetro marca o link da página atual: inicio, jogos, socio, admin ou ''. -->
<header th:fragment="navbar(ativo)" class="border-b border-line bg-surface"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <a href="#conteudo" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:rounded-md focus:bg-surface focus:px-4 focus:py-2 focus:font-bold">
        Pular para o conteúdo</a>

    <div class="conteudo flex flex-wrap items-center gap-x-6 gap-y-1 py-2.5">

        <a th:replace="~{fragments/marca :: logotipo}"></a>

        <nav class="order-last -mx-2.5 flex w-full gap-1 md:order-none md:mx-0 md:w-auto" aria-label="Principal">
            <a th:href="@{/jogos}" class="nav-link" th:attr="aria-current=${ativo == 'jogos'} ? 'page'">Jogos</a>
            <a th:href="@{/sociotorcedor}" class="nav-link" th:attr="aria-current=${ativo == 'socio'} ? 'page'">Seja sócio</a>
            <a th:href="@{/admin}" class="nav-link" sec:authorize="hasRole('ADMIN')"
               th:attr="aria-current=${ativo == 'admin'} ? 'page'">Painel admin</a>
        </nav>

        <div class="ml-auto flex items-center gap-2">
            <button type="button" id="themeToggle" aria-label="Usar tema escuro" aria-pressed="false"
                    class="grid size-11 place-items-center rounded-full text-ink-muted hover:bg-surface-2 hover:text-ink">
                <svg width="20" height="20" class="size-5 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                <svg width="20" height="20" class="hidden size-5 dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>

            <div sec:authorize="isAnonymous()">
                <a th:href="@{/login}" class="btn btn-principal">Entrar</a>
            </div>

            <div sec:authorize="isAuthenticated()" class="relative">
                <button type="button" id="userMenuBtn" aria-haspopup="true" aria-expanded="false"
                        aria-controls="profileDropdown"
                        class="flex min-h-11 items-center gap-2 rounded-full border border-line p-1 font-semibold hover:bg-surface-2 sm:pr-3">
                    <span class="grid size-9 place-items-center rounded-full bg-brand text-brand-ink" aria-hidden="true">
                        <svg width="20" height="20" class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    </span>
                    <span class="sr-only">Menu da conta</span>
                    <!-- no celular só o avatar, para a navbar caber numa linha; o nome aparece no menu -->
                    <span class="hidden max-w-28 truncate text-sm sm:inline" aria-hidden="true" sec:authentication="name">usuário</span>
                </button>

                <div id="profileDropdown"
                     class="painel absolute top-full right-0 z-40 mt-2 hidden w-64 p-2 shadow-lg [&.active]:block">
                    <p class="px-3 pt-1 pb-2 text-sm text-ink-muted">
                        Conectado como <strong class="text-ink" sec:authentication="name">usuário</strong></p>
                    <ul class="border-t border-line pt-2">
                        <li><a th:href="@{/perfil}" class="menu-item">Minha conta e ingressos</a></li>
                        <li><a th:href="@{/sociotorcedor}" class="menu-item">Minha associação</a></li>
                        <li sec:authorize="hasRole('ADMIN')"><a th:href="@{/admin}" class="menu-item">Painel administrativo</a></li>
                        <li class="mt-2 border-t border-line pt-2">
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="menu-item text-danger">Sair da conta</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <script th:src="@{/js/theme.js}"></script>
</header>
