<!-- Peças de jogo usadas na página inicial, no calendário, na página do jogo e na compra. -->
<html xmlns:th="http://www.thymeleaf.org">

<!--
  Confronto: escudos e siglas. A parte visual fica escondida dos leitores de tela, que recebem
  os nomes completos ("São Paulo FC contra Grêmio").
  Uso: <span th:replace="~{fragments/jogo :: confronto(${jogo}, 'size-10', 'display text-3xl')}"></span>
-->
<span th:fragment="confronto(jogo, classeEscudo, classeSigla)" class="inline-flex min-w-0 items-center">
    <span class="sr-only" th:text="${jogo.casa.nome + ' contra ' + jogo.fora.nome}">São Paulo FC contra Grêmio</span>
    <span class="inline-flex min-w-0 flex-wrap items-center gap-x-2.5 gap-y-1" aria-hidden="true">
        <img th:src="@{${jogo.casa.escudoPath}}" th:alt="${jogo.casa.nome}" th:class="${classeEscudo + ' shrink-0 object-contain'}"
             width="48" height="48" decoding="async">
        <span th:class="${classeSigla}" th:text="${jogo.casa.sigla}">SPFC</span>
        <span th:class="${classeSigla + ' text-ink-muted'}">×</span>
        <span th:class="${classeSigla}" th:text="${jogo.fora.sigla}">GRE</span>
        <img th:src="@{${jogo.fora.escudoPath}}" th:alt="${jogo.fora.nome}" th:class="${classeEscudo + ' shrink-0 object-contain'}"
             width="48" height="48" decoding="async">
    </span>
</span>

<!--
  Linha do calendário: leva à página do jogo.
  Uso: <a th:replace="~{fragments/jogo :: linha(${jogo}, ${destaque})}"></a>
-->
<a th:fragment="linha(jogo, destaque)" th:href="@{/jogos/{id}(id=${jogo.id})}"
   th:with="encerrado=${jogo.dhJogo.isBefore(#temporals.createNow())}"
   class="grid grid-cols-[3rem_minmax(0,1fr)_auto] items-center gap-x-4 border-b border-line py-4 pl-1 pr-1 text-ink no-underline hover:bg-surface-2 sm:grid-cols-[3.5rem_minmax(0,1fr)_auto]"
   th:classappend="${encerrado} ? 'text-ink-muted'">
    <time th:datetime="${@formato.iso(jogo.dhJogo)}" class="grid justify-items-center leading-none">
        <span class="display text-2xl sm:text-3xl" th:text="${jogo.dhJogo.dayOfMonth}">23</span>
        <span class="mt-1 text-sm font-semibold text-ink-muted" th:text="${@formato.diaSemana(jogo.dhJogo)}">sáb</span>
    </time>
    <span class="grid min-w-0 gap-1.5">
        <span th:replace="~{fragments/jogo :: confronto(${jogo}, 'size-7', 'display text-xl leading-none')}"></span>
        <span class="text-sm text-ink-muted">
            <span th:text="${@formato.hora(jogo.dhJogo) + ', ' + jogo.nomeEstadio + '.'}">21h, MorumBIS.</span>
            <span th:text="${jogo.campeonato}">Brasileirão 2026</span>
        </span>
    </span>
    <span class="flex items-center gap-1 text-sm font-bold">
        <span th:if="${destaque and !encerrado}" class="text-brand">Próximo</span>
        <span th:if="${encerrado}" class="font-semibold text-ink-muted">Encerrado</span>
        <svg th:replace="~{fragments/icones :: icone('seguir', 'size-5 text-ink-muted')}"></svg>
    </span>
</a>

</html>
