<!-- Cabeçalho comum. Uso, dentro de <head>: <th:block th:replace="~{fragments/head :: base('Título')}"/> -->
<th:block th:fragment="base(titulo)" xmlns:th="http://www.thymeleaf.org">
    <meta charset="UTF-8">
    <!-- Lê o token CSRF logo no começo: cria a sessão antes de a resposta começar a ser enviada.
         Sem isso, páginas com formulário podem falhar com "Cannot create a session after the response has been committed". -->
    <meta name="_csrf" th:content="${_csrf?.token}">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title th:text="${titulo} + ' | ' + #{clube.curto}">Ventania</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/brasao.svg}">
    <!-- Tema escolhido pelo torcedor (salvo no navegador) ou o do sistema. Roda antes de pintar para não piscar. -->
    <script>
        (function () {
            var t = null;
            try { t = localStorage.getItem('tema'); } catch (e) { }
            if (t !== 'dark' && t !== 'light') {
                t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Sofia+Sans:ital,wght@0,400..800;1,400..600&amp;family=Sofia+Sans+Extra+Condensed:wght@600..900&amp;display=swap">
    <!-- Paleta (único lugar das cores) e o CSS gerado pelo Tailwind -->
    <link rel="stylesheet" th:href="@{/css/paleta.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/theme.js}" defer></script>
</th:block>
