<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: base('Minha conta')}"/>
    <link rel="stylesheet" th:href="@{/css/conta.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="page page-narrow">
    <div class="page-head">
        <h1>Minha conta</h1>
    </div>

    <section class="panel">
        <dl class="dl">
            <dt>Usuário</dt>
            <dd th:text="${#authentication.principal.username}">usuario</dd>

            <dt>E-mail</dt>
            <dd th:text="${#authentication.principal.email} ?: '—'">email@exemplo.com</dd>

            <dt>Nome</dt>
            <dd th:text="${#authentication.principal.associado?.nome} ?: '—'">Nome</dd>

            <dt>Associação</dt>
            <dd>
                <span class="badge"
                      th:text="${#authentication.principal.associado?.categoria?.descricao} ?: 'Não associado'">Não associado</span>
            </dd>
        </dl>

        <div class="actions">
            <a th:href="@{/sociotorcedor}" class="btn btn-brand">Gerenciar associação</a>
            <a th:href="@{/jogos}" class="btn btn-ghost">Ver jogos</a>
        </div>
    </section>
</main>

</body>
</html>
