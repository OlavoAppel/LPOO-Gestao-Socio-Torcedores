<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: base('Criar conta')}"/>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="page page-narrow auth-page">
    <div class="panel auth-panel">
        <h1>Criar conta</h1>
        <p class="lead">Preencha seus dados. Campos com * são obrigatórios.</p>

        <div class="alerts" th:if="${erro}">
            <div class="alert alert-error" role="alert" th:text="${erro}"></div>
        </div>

        <form th:action="@{/cadastro}" th:object="${cadastroForm}" method="post" class="form" novalidate>

            <div class="field">
                <label for="nome">Nome completo *</label>
                <input type="text" id="nome" th:field="*{nome}" autocomplete="name">
                <span class="field-error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
            </div>

            <div class="field-row">
                <div class="field">
                    <label for="username">Usuário *</label>
                    <input type="text" id="username" th:field="*{username}" autocomplete="username">
                    <span class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
                </div>
                <div class="field">
                    <label for="senha">Senha *</label>
                    <input type="password" id="senha" th:field="*{senha}" autocomplete="new-password">
                    <span class="field-error" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></span>
                </div>
            </div>

            <div class="field">
                <label for="email">E-mail *</label>
                <input type="email" id="email" th:field="*{email}" placeholder="nome@email.com" autocomplete="email">
                <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </div>

            <div class="field">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" th:field="*{cpf}" inputmode="numeric" maxlength="11" placeholder="Somente números">
                <span class="hint">11 dígitos, sem pontos ou traço.</span>
                <span class="field-error" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></span>
            </div>

            <div class="field-row">
                <div class="field">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" th:field="*{telefone}" autocomplete="tel">
                </div>
                <div class="field">
                    <label for="dataNascimento">Data de nascimento</label>
                    <input type="date" id="dataNascimento" th:field="*{dataNascimento}">
                </div>
            </div>

            <button type="submit" class="btn btn-brand btn-block">Criar conta</button>
        </form>

        <p class="auth-footer">Já tem conta? <a th:href="@{/login}">Entrar</a></p>
    </div>
</main>

</body>
</html>
