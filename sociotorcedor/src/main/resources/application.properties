spring.application.name=socio-torcedor
server.port=8080

spring.thymeleaf.cache=false


spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME}

spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Telas sempre em português do Brasil (datas, números e mensagens de validação),
# qualquer que seja o idioma que o navegador envia.
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# Regras de venda de ingressos (cadeia de validação dos lotes)
# Máximo de ingressos que uma conta pode comprar por jogo, somando todos os setores (1 = um ingresso por conta).
ingresso.limite-por-jogo=1
